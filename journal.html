<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Journal</title>
<meta name="theme-color" content="#08080A">
<link rel="icon" href="assets/apps/journal.png" type="image/png">
<link rel="stylesheet" href="css/neo.css">
</head>
<body class="gated jr-page">
  <div id="gateNote" class="gate-note">
    <span>Checking your session…</span>
    <a href="index.html" class="gate-escape">Go to sign in</a>
  </div>

  <div id="carrier"></div>

  <header class="jr-top">
    <a class="ig-home" href="home.html" title="Home">⌂</a>
    <span class="jr-word">Journal</span>
    <nav class="jr-tabs" id="jrTabs">
      <button class="jr-tab is-on" data-view="mine">My journal</button>
      <button class="jr-tab jr-admin" data-view="players" hidden>Players</button>
      <button class="jr-tab jr-admin" data-view="recent" hidden>Recent</button>
    </nav>
    <button class="jr-new" id="jrNew" title="New entry">✎ <span>New entry</span></button>
  </header>

  <main class="jr-main" id="jrMain">
    <div class="ig-loading">Loading…</div>
  </main>

  <div id="modalRoot"></div>

<script type="module" src="js/journal.js"></script>
</body>
</html>
