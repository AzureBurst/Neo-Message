<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Instagrat</title>
<meta name="theme-color" content="#08080A">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/neo.css">
</head>
<body class="gated">
  <div id="gateNote" class="gate-note">
    <span>Checking your session…</span>
    <a href="index.html" class="gate-escape">Go to sign in</a>
  </div>

  <div id="carrier"></div>

  <header class="ig-top">
    <a class="ig-home" href="home.html" title="Home">⌂</a>
    <span class="ig-word">Instagrat</span>
    <nav class="ig-tabs">
      <button class="ig-tab is-on" data-view="feed"    title="Feed">▦</button>
      <button class="ig-tab"       data-view="explore" title="Find people">⌕</button>
      <button class="ig-tab"       data-view="me"      title="My profile">◍</button>
      <button class="ig-tab"       data-view="activity" title="Activity">♡<span class="tab-badge" id="reqBadge" hidden></span></button>
      <button class="ig-tab ig-admin-tab" data-view="review" title="Review queue" hidden>⚑<span class="tab-badge" id="queueBadge" hidden></span></button>
    </nav>
    <button class="ig-post-btn" id="newPostBtn" title="New post">＋</button>
  </header>

  <main class="ig-main" id="igMain">
    <div class="ig-loading">Loading…</div>
  </main>

  <div id="modalRoot"></div>

<script type="module" src="js/instagrat.js"></script>
</body>
</html>
